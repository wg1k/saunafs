# SaunaFS Metadumper Service Configuration
# This file contains configuration options for the metadata dumping service

# Enable/disable the new service architecture
# Set to 1 or true to use the new service-based architecture
# Set to 0 or false to use the original fork-based approach
# Default: false (for backward compatibility)
METADUMPER_USE_SERVICE_ARCHITECTURE=false

# Socket path for the metadumper service
# Only used when METADUMPER_USE_SERVICE_ARCHITECTURE=true
# Default: /var/run/saunafs/metadumper.sock
METADUMPER_SERVICE_SOCKET=/var/run/saunafs/metadumper.sock

# Enable/disable the metadumper service
# Only used when METADUMPER_USE_SERVICE_ARCHITECTURE=true
# Set to 1 or true to enable, 0 or false to disable
# Default: true
METADUMPER_SERVICE_ENABLED=true

# Enable/disable fallback to local dumping when service is unavailable
# Only used when METADUMPER_USE_SERVICE_ARCHITECTURE=true
# Set to 1 or true to enable, 0 or false to disable
# Default: true
METADUMPER_FALLBACK_ENABLED=true

# Service timeout in milliseconds
# Only used when METADUMPER_USE_SERVICE_ARCHITECTURE=true
# Default: 30000 (30 seconds)
METADUMPER_SERVICE_TIMEOUT_MS=30000

# Maximum number of retries when service communication fails
# Only used when METADUMPER_USE_SERVICE_ARCHITECTURE=true
# Default: 3
METADUMPER_MAX_RETRIES=3

